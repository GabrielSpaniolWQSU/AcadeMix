  drive:
    certificados-pasta-id: 1RrceKdLCZYoy6wiOWSj2J6pplGrlrlje
    client-id: ${GOOGLE_DRIVE_CLIENT_ID:}
    client-secret: ${GOOGLE_DRIVE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_DRIVE_REDIRECT_URI:http://localhost:8080/api/google-drive/callback}
