server:
  port: 8080
spring:
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB

meta:
  api:
    key: ${META_API_KEY:}
    base-url: ${META_API_BASE_URL:https://api.meta.ai/v1}
    model: ${META_MODEL:muse-spark-1.3}

# Credenciais opcionais para conectar o Google Drive.
