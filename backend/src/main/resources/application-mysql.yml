spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/gestao_academica?connectionTimeZone=America/Sao_Paulo}
    username: ${DB_USER:gestao_app}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
